minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Backport releases published after newer majors gained provenance/trusted
# publishing — pnpm orders trust by publish date, so these look like
# downgrades but are legitimate (see pnpm/pnpm discussion #11084).
trustPolicyExclude:
  - semver@6.3.1
  - eslint-import-resolver-typescript@3.10.1

# @vercel/oidc lost its npm provenance attestation as of 3.8.2 (2026-08-03)
# and every release since; pin to the last attested version until that's
# resolved upstream. Same publish timestamp as the @vercel/functions
# provenance loss pinned in package.json — likely one release-pipeline change.
overrides:
  "@vercel/oidc": "3.8.1"

packages:
  - .

# pnpm 11 replaces onlyBuiltDependencies/ignoredBuiltDependencies with this
# map; unlisted packages with build scripts fail the install (strictDepBuilds).
allowBuilds:
  esbuild: false
  lefthook: true
  protobufjs: false
  sharp: false
  unrs-resolver: false
