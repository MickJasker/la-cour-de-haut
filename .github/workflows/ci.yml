name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (base = another feature branch) must get
  # the same checks as PRs into main.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm exec next typegen

      - run: pnpm tsc --noEmit --incremental false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm format:check

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm test

  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec react-doctor --yes --no-telemetry --json . | tee react-doctor.json

      - run: node -e "const r=require('./react-doctor.json'); if(r.summary.errorCount>0) process.exit(1)"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, format]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}

      - run: pnpm exec playwright install chromium --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # global-setup creates (and tears down) a Neon branch + server per worker — ADR-0027.
      - run: pnpm test:e2e
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          # e2e runs against a production build (next build && next start) so PPR
          # / 'use cache' behave as in prod. E2E_TESTING re-opens the gallery
          # cache-bust route, which is otherwise closed under NODE_ENV=production.
          E2E_TESTING: "1"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:3000
          OWNER_EMAIL: admin@lacourdehaut.fr
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      # Safety net: globalSetup's teardown deletes its branches, but a cancelled or
      # killed job never reaches it. Sweep anything this run left behind.
      - name: Sweep leaked Neon E2E branches
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          API="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches"
          list() {
            curl -sf "$API" -H "Authorization: Bearer $NEON_API_KEY" \
              | jq -r --arg p "e2e-$RUN_ID-" --arg t "$1" \
                '.branches[] | select(.name | startswith($p)) | select((.name | endswith("-template")) == ($t == "true")) | .id'
          }
          # Workers first; Neon deletes asynchronously and refuses to drop a
          # parent that still has children, so give them time before the template.
          for id in $(list false); do
            curl -sf -X DELETE "$API/$id" -H "Authorization: Bearer $NEON_API_KEY" || echo "failed to delete $id"
          done
          sleep 15
          for id in $(list true); do
            curl -sf -X DELETE "$API/$id" -H "Authorization: Bearer $NEON_API_KEY" || echo "failed to delete $id"
          done
